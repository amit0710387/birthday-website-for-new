<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday,ITI! 🎉</title>
    <style>
        /* Modern reset and font setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #efe1fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            color: #333;
        }

        /* The main large container for the website */
        .birthday-card {
            background: #ffffff;
            max-width: 700px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 50px 40px;
            text-align: center;
            overflow: hidden;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* Decorative Emoji elements */
        .decor-emoji {
            font-size: 3rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        /* Big, bold heading */
        h1 {
            font-size: 3rem;
            color: #d81b60;
            margin-bottom: 20px;
            font-weight: 800;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* Stylized Image Section */
        .photo-container {
            width: 100%;
            max-height: 400px;
            overflow: hidden;
            border-radius: 15px;
            margin: 30px 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 5px solid #fff;
            outline: 1px solid #e0e0e0;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .photo-container img:hover {
            transform: scale(1.03);
        }

        /* Big, clean text for the message */
        .message {
            font-size: 1.35rem;
            line-height: 1.8;
            color: #555;
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* Interactive celebration button */
        .wish-button {
            background: linear-gradient(45deg, #ff4081, #ec407a);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(236, 64, 122, 0.4);
            transition: all 0.3s ease;
        }

        .wish-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(236, 64, 122, 0.6);
        }

        .wish-button:active {
            transform: translateY(1px);
        }

        /* CSS Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Responsive design for smaller mobile screens */
        @media (max-width: 480px) {
            h1 { font-size: 2.2rem; }
            .birthday-card { padding: 30px 20px; }
            .message { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="birthday-card">
        <div class="decor-emoji">🎂</div>
        
        <!-- You can change the name below to whoever you are wishing -->
        <h1>Happy Birthday ITI!</h1> 
        
        <!-- This is your photo placeholder -->
        <div class="photo-container">
            <img src="birthday-photo.jpg" alt="Birthday Celebration Photo">
        </div>

        <!-- You can edit this text to write your personal wish -->
        <p class="message">
Happy birthday  bhutku! ajker din ta tor jano life er sob cheye valo din hoy.everything you see is just for you .tor mukhe ekta boro smile dkhar jnno.i want to you to get all the success and hapiness in life . Have an incredible celebration! ✨
        </p>

        <!-- An interactive button that pops up an alert when clicked -->
        <button class="wish-button" onclick="celebrate()">Click to Celebrate! 🎉</button>
    </div>

    <script>
        function celebrate() {
            alert("✨ Sending you the biggest, warmest birthday wishes! Have a fantastic day! 🎈✨");
        }
    </script>

</body>
</html>
